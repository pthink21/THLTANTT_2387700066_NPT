stages: [test, security, build, deploy]

variables:
  NPM_CONFIG_CACHE: "$CI_PROJECT_DIR/Buoi6/.npm"
  NPM_CONFIG_AUDIT: "false"
  NPM_CONFIG_FUND: "false"

default:
  image: node:24-bookworm-slim
  before_script:
    - cd Buoi6
    - npm ci --cache "$NPM_CONFIG_CACHE" --prefer-offline
  cache:
    key:
      files: [Buoi6/package-lock.json]
    paths: [Buoi6/.npm/]

unit-tests:
  stage: test
  script:
    - npm test

security-check:
  stage: security
  script:
    - npm run security

dependency-audit:
  stage: security
  script:
    - npm run audit
  artifacts:
    when: always
    paths:
      - Buoi6/evidence/npm-audit.json
    expire_in: 7 days

semgrep:
  stage: security
  image:
    name: semgrep/semgrep:1.182.0
    entrypoint: [""]
  before_script: []
  cache: []
  script:
    - semgrep scan --config p/javascript --error --metrics=off Buoi6/src Buoi6/scripts

secret-scan:
  stage: security
  image:
    name: zricethezav/gitleaks:v8.30.1
    entrypoint: [""]
  before_script: []
  cache: []
  script:
    - gitleaks dir Buoi6 --redact --exit-code 1

build-job:
  stage: build
  script:
    - npm run build
    - npm run checksums
  artifacts:
    paths:
      - Buoi6/build/
      - Buoi6/reports/build-sha256.json
    expire_in: 7 days

pages:
  stage: deploy
  before_script: []
  cache: []
  dependencies: [build-job]
  script:
    - mv Buoi6/build public
  pages:
    publish: public
  artifacts:
    paths: [public/]
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
